# Mirrors `make lint test build`. Never run on GitHub yet (this repo is not pushed);
# checked locally with action-validator. Adapted from the testing track's recipe
# (stellar-research/stellar/testing/lab/ci/contracts.yml). Add a job per test layer as
# TESTING.md introduces it.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # Installs the toolchain, target and components pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Installs the stellar-cli release that matches the action's ref.
      - uses: stellar/stellar-cli@v28.1.0
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build Wasm
        run: make build

  # Model-based tests (TESTING.md §3): the Quint model's tests and invariants, and a check
  # that the committed traces in quint/traces/ are not stale. The replay itself runs in
  # `make test`.
  quint:
    name: Quint model and traces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Quint
        run: npm install --global @informalsystems/quint@0.33.0
      - name: Model, invariants and stale traces
        run: make quint
