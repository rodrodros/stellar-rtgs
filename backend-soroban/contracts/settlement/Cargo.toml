[package]
name = "settlement"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
# `alloc` gives the Wasm a global allocator. rtgs-core is soroban-free, so its rules use
# `alloc::vec::Vec` rather than the host's Vec, and linking it needs one. The SDK calls
# the feature a last resort, for its CPU and code-size cost (C-SC-224).
soroban-sdk = { workspace = true, features = ["alloc"] }
rtgs-core = { path = "../../crates/rtgs-core" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
itf = "0.4.0"
serde = { version = "1", features = ["derive"] }
proptest = "1.12.0"
proptest-state-machine = "0.9.0"
