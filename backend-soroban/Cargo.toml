[workspace]
resolver = "2"
members = [
  "contracts/*",
  "crates/*",
]

[workspace.dependencies]
soroban-sdk = "=29.0.1"

[workspace.lints.clippy]
# No single-letter names. The lint itself exempts generics, lifetimes and `_`;
# clippy.toml lists the other short names it allows.
min_ident_chars = "warn"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://developers.stellar.org/docs/build/smart-contracts/example-contracts/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# The test host is slow unoptimised. Optimise dependencies only, so a change to a contract
# still recompiles in seconds.
[profile.dev.package."*"]
opt-level = 3
